[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cents"
version = "0.1.0"
description = "Zero-dependency personal finance CLI: import bank CSVs, categorize spending (rules + optional local LLM), and render a self-contained 'where my money went' report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prateek Mulye" }]
keywords = ["finance", "budget", "cli", "csv", "spending", "personal-finance"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/prateekmulye/cents"

[project.scripts]
cents = "cents.cli:main"

[tool.setuptools]
packages = ["cents"]
